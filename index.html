<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tensegrity Data Locator — Prototype</title>
<style>
body{font-family:system-ui,Segoe UI,Arial;margin:20px;color:#222}
label{display:block;margin-top:10px}
textarea{width:100%;height:80px}
input[type=text]{width:100%}
.candidate{border:1px solid #ccc;padding:8px;margin:8px 0}
.small{font-size:0.9em;color:#444}
button{margin-top:8px}
pre{background:#f7f7f7;padding:8px;overflow:auto}
</style>
</head>
<body>
<h3>TensegrityDataLocator (prototype)</h3>
<p class="small">I am Marmalade, watching the files. Paste candidate URLs and sample excerpts; this tool captures concise JSON summaries for follow-up.</p>
<label>Paper title or DOI<input id="paper" type="text" placeholder="Title or DOI"></label>
<label>Notes about paper (optional)<textarea id="paperNotes"></textarea></label>
<div id="candidates"></div>
<button id="add">Add candidate</button>
<button id="report">Generate JSON Report</button>
<h4>JSON Report</h4>
<pre id="out">{}</pre>
<script>
function newCandidate(data){
  const div=document.createElement('div');div.className='candidate';
  div.innerHTML=`
    <label>URL or identifier<input type=text class=url value="${data?.url||''}"></label>
    <label>Type hint (csv/json/other)<input type=text class=type placeholder="csv/json/other" value="${data?.type||''}"></label>
    <label>Found? <select class=found><option value="unknown">unknown</option><option value="yes">yes</option><option value="no">no</option></select></label>
    <label>Sample/excerpt (paste few lines of file content)<textarea class=sample>${data?.sample||''}</textarea></label>
    <label>Notes<textarea class=notes>${data?.notes||''}</textarea></label>
    <button class=remove>Remove</button>
  `;
  div.querySelector('.remove').onclick=()=>div.remove();
  if(data?.found) div.querySelector('.found').value=data.found;
  document.getElementById('candidates').appendChild(div);
}

document.getElementById('add').onclick=()=>newCandidate();
// add one starter
newCandidate();

function summarizeSample(text){
  if(!text) return {sampleLines:[],preview:''};
  const lines=text.trim().split('\n').slice(0,10);
  return {sampleLines:lines,preview:lines.join('\n')};
}

document.getElementById('report').onclick=()=>{
  const paper=document.getElementById('paper').value.trim();
  const paperNotes=document.getElementById('paperNotes').value.trim();
  const nodes=document.querySelectorAll('.candidate');
  const items=[];
  nodes.forEach(n=>{
    const url=n.querySelector('.url').value.trim();
    const typeHint=n.querySelector('.type').value.trim();
    const found=n.querySelector('.found').value;
    const sample=n.querySelector('.sample').value;
    const notes=n.querySelector('.notes').value.trim();
    const s=summarizeSample(sample);
    // simple heuristic for CSV/JSON
    let detected=null;
    const t=typeHint.toLowerCase();
    if(t) detected=t;
    else{
      const s0=sample.trim();
      if(s0.startsWith('{')||s0.startsWith('[')) detected='json';
      else if(s0.split('\n')[0] && s0.split('\n')[0].includes(',')) detected='csv';
      else detected='unknown';
    }
    items.push({url:url||null,typeHint:typeHint||null,detectedType:detected,found:found,sampleLines:s.sampleLines,notes:notes});
  });
  const report={paper:paper||null,paperNotes:paperNotes||null,generatedAt:new Date().toISOString(),candidates:items};
  document.getElementById('out').textContent=JSON.stringify(report,null,2);
};
</script>
</body>
</html>
